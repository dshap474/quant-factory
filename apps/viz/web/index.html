<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Already dark: without this, Dark Reader tints links blue during load, then backs off. -->
    <meta name="darkreader-lock" />
    <title>quant-factory Viz</title>
    <script>
      // Apply the saved palette before first paint (key: qf-viz-theme in app-settings.ts).
      try {
        const theme = localStorage.getItem('qf-viz-theme');
        if (theme && theme !== 'sand') document.documentElement.setAttribute('data-theme', theme);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
