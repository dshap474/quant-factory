[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-features"
version = "0.1.0"
description = "Feature publication system for quant-factory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.1.0",
    "matplotlib>=3.8",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.2.0",
    "polars>=1.36.1",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "sf-hamilton>=1.0.0",
    "quant-factory-config",
    "quant-factory-data",
    "quant-factory-family-registry",
    "statsmodels>=0.14.0",
    "typer>=0.12.0",
]

[project.scripts]
qf-features = "features.cli.main:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/features"]

[tool.hatch.build.targets.sdist]
exclude = ["/.features/**", "/extensions/**"]
