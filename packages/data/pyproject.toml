[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-data"
version = "0.1.0"
description = "Canonical data control plane for quant-factory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deltalake==1.6.6",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "polars>=1.36.1",
    "pyarrow>=14.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0.2",
    "quant-factory-config",
    "typer>=0.12.0",
]

[project.scripts]
qf-data = "data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]

[tool.hatch.build.targets.sdist]
exclude = ["/.data/**", "/extensions/**", "/tests/**"]
