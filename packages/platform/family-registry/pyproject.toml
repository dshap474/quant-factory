[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-family-registry"
version = "0.1.0"
description = "Decorator registry and extensions/lib discovery for package families."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2.0", "ruff>=0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/family_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
