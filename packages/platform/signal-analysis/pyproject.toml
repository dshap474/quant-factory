[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-signal-analysis"
version = "0.2.0"
description = "Explicitly timed targets and descriptive signal analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0",
    "polars>=1.36.1",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=8.2.0", "ruff>=0.15.5", "ty>=0.0.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/signal_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
