[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinbase-advanced-client"
version = "0.1.0"
description = "Thin auth/config facade over the official coinbase-advanced-py SDK."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "coinbase-advanced-py==1.8.4",
    "quant-factory-config",
]

[project.scripts]
qf-coinbase-products = "coinbase_advanced_client.cli:main"

[tool.uv.sources]
quant-factory-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/coinbase_advanced_client"]
