[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fred-client"
version = "0.1.0"
description = "Thin FRED and ALFRED client for quant-factory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "client-common",
    "polars>=1.36.1",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fred_client"]
