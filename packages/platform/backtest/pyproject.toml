[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-backtest"
version = "0.1.0"
description = "Backtest engine and connectors for quant-factory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "nautilus-trader==1.224.0",
    "numpy>=1.26.0,<2.0",
    "polars>=1.36.1",
    "quant-factory-execution",
    "quant-factory-strategies",
    "typer>=0.12.0",
]

[project.scripts]
qf-backtest = "backtest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
