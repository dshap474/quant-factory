# --------------------------------------------------------------------------- #
# Project metadata
# --------------------------------------------------------------------------- #
# The package uses a src layout so imports always resolve from an installed
# distribution (or an explicitly configured editable development install).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-engine"
version = "0.1.0"
description = "A domain-neutral engine for leakage-safe tabular predictive pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "quant-factory-signal-analysis>=0.1.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
xgboost = ["xgboost>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a20",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
