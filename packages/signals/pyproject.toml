[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-factory-signals"
version = "0.1.0"
description = "Signal package surface for quant-factory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.36.1",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "quant-factory-config",
    "quant-factory-family-registry",
    "quant-factory-signal-analysis",
    "typer>=0.12.0",
]

[project.scripts]
qf-signals = "signals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signals"]

[tool.hatch.build.targets.sdist]
exclude = ["/.signals/**", "/extensions/**"]
