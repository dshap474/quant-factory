[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers (also registered in conftest.py)
markers =
    boundary: Single package boundary tests (fast, isolated)
    workflow: Multi-package workflow tests (medium duration)
    e2e: End-to-end system tests (full pipeline, slow)
    regression: Regression tests against golden outputs
    slow: Tests taking > 30 seconds
    mlx: Tests requiring Apple Silicon MLX (skip on CI)
    statistical: Property-based/statistical tests (Hypothesis)

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Timeout (30s default for boundary tests, override with --timeout for slower tests)
timeout = 30

# Fail on warnings to catch deprecations early
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::scipy.stats._warnings_errors.ConstantInputWarning

# Coverage configuration
[coverage:run]
branch = True
source =
    data
    features
    backtest
omit =
    */tests/*
    */__init__.py

[coverage:report]
fail_under = 70
show_missing = True
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    @abstractmethod
    @abc.abstractmethod
    if __name__ == "__main__":
